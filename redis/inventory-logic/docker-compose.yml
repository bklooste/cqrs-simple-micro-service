version: '3.4'

services:
  simplecqrs-redis:
    image: ${DOCKER_REGISTRY-}simplecqrsredisapi
    container_name: simplecqrs-redis-itest
    environment:
      - LOG_LEVEL=DEBUG
      - Streams:ConnectionString=redis:6379,allowAdmin=false
    ports:
      - 54105:8080
      
  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6479:6379   
    volumes:
      - redis-data:/data

volumes:
  redis-data: